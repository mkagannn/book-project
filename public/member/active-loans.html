<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Active Loans — CityLibrary</title>
  
  <link rel="stylesheet" href="../components/sidebar.css">
  <link rel="stylesheet" href="../components/loans.css">
  
  <style>
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-active {
      background: #dcfce7;
      color: #16a34a;
    }
    .status-overdue {
      background: #fee2e2;
      color: #ef4444;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .btn-browse {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 16px;
      background: #0f766e;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-browse:hover {
      background: #115e59;
    }
  </style>
</head>
<body class="app-layout">

  <!-- Sidebar -->
  <div id="sidebar-container" data-sidebar="sidebar.html"></div>

  <!-- Main Content -->
  <main class="main-content">
    
    <div class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">Active Loans</h1>
        <p style="color:#64748b; margin-top:4px; font-size:14px;">Monitor your currently borrowed books and upcoming due dates.</p>
      </div>
    </div>

    <!-- Tablo -->
    <div class="table-container">
      <table class="loans-table">
        <thead>
          <tr>
            <th>Book</th>
            <th>Borrowed Date</th>
            <th>Due Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="loans-tbody">
          <!-- JS ile doldurulacak -->
        </tbody>
      </table>
    </div>

  </main>

  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>

  <script src="../js/active-loans.js"></script>
</body>
</html>
