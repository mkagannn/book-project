<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Catalog — Admin | CityLibrary</title>
  <link rel="stylesheet" href="../components/sidebar.css">
  <link rel="stylesheet" href="../components/loans.css">
  
  <style>
    /* Catalog specific styles */
    .catalog-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 16px;
    }

    .search-bar {
      position: relative;
      flex-grow: 1;
      max-width: 1200px;
    }
    .search-bar input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #334155;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .search-bar input:focus {
      outline: none;
      border-color: #0f766e;
    }
    .search-bar svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }

    .btn-primary {
      background: #0f766e;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #115e59;
    }

    .btn-edit {
      background: #f1f5f9;
      color: #0f766e;
      border: 1px solid #cbd5e1;
      padding: 5px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-edit:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-danger:hover {
      background: #b91c1c;
      box-shadow: 0 4px 6px -1px rgba(220, 38, 38, 0.2);
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-available { background: #dcfce7; color: #16a34a; }
    .badge-borrowed { background: #fee2e2; color: #ef4444; }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.active { display: flex; }
    
    .modal-content {
      background: #fff;
      padding: 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    
    .modal-header {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #0f172a;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .form-control:focus {
      outline: none;
      border-color: #0f766e;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-secondary:hover { background: #e2e8f0; }

    .book-cell { display: flex; align-items: center; gap: 12px; }
    .book-icon {
      width: 40px; height: 40px; background: #f8fafc; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; color: #94a3b8;
    }
    .book-icon svg { width: 20px; height: 20px; }
  </style>
</head>

<body>

  <div class="app-layout">
    <!-- Admin Sidebar -->
    <div id="sidebar-container" data-sidebar="sidebar.html"></div>

    <!-- Main Content -->
    <main class="main-content">
      
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Book Catalog</h1>
          <p style="color:#64748b; margin-top:4px; font-size:14px;">Manage all books in the library inventory.</p>
        </div>
        <div class="page-header-right" id="total-records-container">
          <span class="dot"></span>
          <span id="total-records">0 Books</span>
        </div>
      </div>

      <div class="catalog-actions">
        <!-- Search Bar -->
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search books or authors..." oninput="filterBooks()">
        </div>

        <button class="btn-primary" onclick="openAddBookModal()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
          Add New Book
        </button>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table class="loans-table">
          <thead>
            <tr>
              <th>Book Info</th>
              <th>Author</th>
              <th>Added Date</th>
              <th>Current Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="books-tbody">
            <!-- JS will populate -->
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <!-- Add Book Modal -->
  <div class="modal-overlay" id="addBookModal">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">Add New Book</div>
      
      <div class="form-group">
        <label for="bookTitle">Book Title</label>
        <input type="text" id="bookTitle" class="form-control" placeholder="e.g. The Great Gatsby">
      </div>

      <div class="form-group">
        <label for="bookAuthor" style="display:flex; justify-content:space-between; align-items:center;">
          <span>Author</span>
          <a href="#" onclick="toggleNewAuthor(event)" id="toggleAuthorBtn" style="font-size: 12px; color: #0f766e; text-decoration: none;">+ Add New Author</a>
        </label>
        
        <!-- Select Existing Author -->
        <select id="bookAuthor" class="form-control">
          <option value="">Select an Author...</option>
        </select>
        
        <!-- Create New Author (Hidden by default) -->
        <div id="newAuthorContainer" style="display: none;">
          <input type="text" id="newAuthorName" class="form-control" placeholder="Author Name (e.g. Fyodor Dostoevsky)">
          <input type="number" id="newAuthorBirthYear" class="form-control" placeholder="Birth Year (e.g. 1821)" style="margin-top: 8px;">
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeAddBookModal()">Cancel</button>
        <button class="btn-primary" onclick="saveBook()" id="saveBtn">Save Book</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>

  <script src="../js/all-books.js"></script>

</body>
</html>
