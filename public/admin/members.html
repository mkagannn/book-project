<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Members — Admin | CityLibrary</title>
  <link rel="stylesheet" href="../components/sidebar.css">
  <link rel="stylesheet" href="../components/loans.css">
  
  <style>
    /* Catalog specific styles - reusing search layout */
    .catalog-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-bar {
      position: relative;
      flex-grow: 1;
      max-width: 1400px;
    }
    .search-bar input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      color: #334155;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .search-bar input:focus {
      outline: none;
      border-color: #0f766e;
    }
    .search-bar svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: capitalize;
    }
    .badge-admin { background: #f3e8ff; color: #9333ea; }
    .badge-member { background: #dbeafe; color: #1e3a8a; }

    .user-cell { display: flex; align-items: center; gap: 12px; }
    .user-avatar {
      width: 40px; height: 40px; background: #e0f2fe; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; 
      color: #0284c7; font-weight: 700; font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app-layout">
    <!-- Admin Sidebar -->
    <div id="sidebar-container" data-sidebar="sidebar.html"></div>

    <!-- Main Content -->
    <main class="main-content">
      
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Library Members</h1>
          <p style="color:#64748b; margin-top:4px; font-size:14px;">View all registered users and administrators.</p>
        </div>
        <div class="page-header-right" id="total-records-container">
          <span class="dot"></span>
          <span id="total-records">0 Members</span>
        </div>
      </div>

      <div class="catalog-actions">
        <!-- Search Bar -->
        <div class="search-bar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search by name or email..." oninput="filterMembers()">
        </div>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table class="loans-table">
          <thead>
            <tr>
              <th>Member Info</th>
              <th>Role</th>
              <th>Joined Date</th>
              <th>Member ID</th>
            </tr>
          </thead>
          <tbody id="members-tbody">
            <!-- JS will populate -->
          </tbody>
        </table>
      </div>

    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/sidebar.js"></script>

  <script src="../js/members.js"></script>

</body>
</html>
