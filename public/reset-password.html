<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CityLibrary — Reset Password</title>
  <link rel="stylesheet" href="components/auth.css">
</head>

<body>

  <!-- SOL PANEL: Karanlık şehir görseli + logo + slogan -->
  <div class="auth-left">
    <!-- Logo: sol üst -->
    <div class="auth-brand">
      <div class="auth-brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="auth-brand-name">CityLibrary</span>
    </div>

    <!-- Slogan: sol alt -->
    <div class="auth-slogan">
      <h2>A City of Stories.<br>A Place for Everyone.</h2>
      <p>Discover, learn, and connect at your city library.<br>Your next chapter starts here.</p>
    </div>
  </div>

  <!-- SAĞ PANEL: Form -->
  <div class="auth-right">
    <div class="auth-box">

      <h1 id="auth-title">Create New Password</h1>
      
      <p style="color: #64748b; font-size: 14px; margin-bottom: 24px; margin-top: -10px;">
        Please enter your new password below.
      </p>

      <div id="auth-error" class="auth-error"></div>

      <!-- RESET PASSWORD FORMU -->
      <form id="reset-form" onsubmit="handleResetPassword(event)">

        <div class="form-group">
          <label for="reset-password">New Password</label>
          <input type="password" id="reset-password" required minlength="6">
        </div>

        <div class="form-group">
          <label for="reset-password-confirm">Confirm New Password</label>
          <input type="password" id="reset-password-confirm" required minlength="6">
        </div>

        <button type="submit" class="btn-primary" id="reset-btn">Update Password</button>

      </form>

    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>

</body>

</html>
